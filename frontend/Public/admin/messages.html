<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <title>Mensagens | Admin Arteno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-panel-body">
    <div class="admin-layout">
        <div class="admin-mobile-overlay" id="adminMobileOverlay"></div>

        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">
                <img src="/img/logo.png" alt="Logo Arteno" class="admin-sidebar-logo">
                <div>
                    <strong>Arteno</strong>
                    <span>Painel administrativo</span>
                </div>

                <button type="button" class="admin-sidebar-close" id="adminSidebarClose" aria-label="Fechar menu">
                    <span></span>
                    <span></span>
                </button>
            </div>

            <nav class="admin-sidebar-nav">
                <a href="/admin" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-box"></i></span>
                    <span>Produtos</span>
                </a>
                <a href="/admin/categories" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-tags"></i></span>
                    <span>Categorias</span>
                </a>
                <a href="/admin/orders" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                    <span>Pedidos</span>
                </a>
                <a href="/admin/coupons" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-ticket"></i></span>
                    <span>Cupons</span>
                </a>
                <a href="/admin/messages" class="admin-sidebar-link active">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-envelope"></i></span>
                    <span>Mensagens</span>
                    <span class="admin-sidebar-badge" data-admin-message-badge hidden></span>
                </a>
                <a href="/admin/integrations" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-plug"></i></span>
                    <span>Integrações</span>
                </a>
                <a href="/admin/settings" class="admin-sidebar-link">
                    <span class="admin-sidebar-icon"><i class="fa-solid fa-gear"></i></span>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="/" target="_blank" rel="noreferrer" class="admin-sidebar-secondary">Ver loja</a>
                <form action="/admin/logout" method="get">
                    <button type="submit" class="admin-sidebar-logout">Sair</button>
                </form>
            </div>
        </aside>

        <main class="admin-main admin-products-page">
            <header class="admin-products-header">
                <div class="admin-products-header-left">
                    <button type="button" class="admin-mobile-menu-button" id="adminMobileMenuButton" aria-label="Abrir menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <div class="admin-products-title-wrap">
                        <span class="admin-products-title-icon"><i class="fa-solid fa-envelope"></i></span>
                        <h1>Mensagens</h1>
                    </div>
                </div>
            </header>

            <div class="admin-feedback admin-products-feedback" id="adminMessagesFeedback" hidden></div>

            <section class="admin-products-card admin-products-list-panel">
                <div class="admin-empty-state" id="adminMessagesEmptyState" hidden>
                    Ainda não há mensagens enviadas pelo formulário de contato do site.
                </div>

                <div class="admin-table-wrap" id="adminMessagesTableWrap">
                    <table class="admin-products-table admin-products-table-shop">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th class="admin-products-actions-col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="adminMessagesTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="admin-message-modal-overlay" id="adminMessageModalOverlay" hidden>
        <section class="admin-message-modal" id="adminMessageModal" aria-hidden="true" role="dialog" aria-modal="true">
            <div class="admin-message-modal-header">
                <div>
                    <p class="admin-card-kicker">Leitura da mensagem</p>
                    <h2 id="adminMessageModalTitle">Mensagem</h2>
                </div>
                <button type="button" class="admin-message-modal-close" id="adminMessageModalClose" aria-label="Fechar modal">X</button>
            </div>
            <div class="admin-message-modal-meta">
                <span id="adminMessageModalEmail">-</span>
                <span id="adminMessageModalDate">-</span>
                <span id="adminMessageModalStatus" class="admin-message-status-badge new">Nova</span>
            </div>
            <div class="admin-message-modal-body" id="adminMessageModalBody"></div>
            <div class="admin-message-modal-actions">
                <button type="button" class="admin-table-action" id="adminMessageToggleReadButton">Marcar como lida</button>
            </div>
        </section>
    </div>

    <script src="/admin/message-badge.js"></script>
    <script src="/admin/messages.js"></script>
</body>
</html>
